name: Build Windows application

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build executable
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python build.py

      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path release/PolozkyPreOberon/PolozkyPreOberon.exe -DestinationPath release/PolozkyPreOberon-Windows.zip

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: PolozkyPreOberon-Windows
          path: release/PolozkyPreOberon-Windows.zip